services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ngo_postgres
    environment:
      POSTGRES_USER: ngo_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: ngo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngo_user -d ngo_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s  # Give PostgreSQL 30s to start and initialize extensions
    networks:
      - ngo_network

  ollama:
    image: ollama/ollama:latest
    container_name: ngo_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_THREAD=4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ngo_network

  adminer:
    image: adminer:latest
    container_name: ngo_adminer
    ports:
      - "8090:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - ngo_network

  backend:
    build: .
    container_name: ngo_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ngo_user:secure_password@postgres:5432/ngo_db
      POSTGRES_USER: ngo_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: ngo_db
      DEBUG: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      # Embedding Configuration (Phase 5D - Ollama Integration)
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-ollama}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      # Langfuse Observability (Phase 5C)
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure:3
    networks:
      - ngo_network

  # ============ Open WebUI Integration (RAG Chat Interface) ============
  # Provides a user-friendly interface for:
  # - Chat with Ollama models (llama3.2, nomic-embed-text)
  # - Chat with OpenAI models (gpt-4.1-mini)
  # - RAG (Retrieval-Augmented Generation) over your documents
  # - Web search integration (optional)
  # Access at: http://localhost:3000
  # Docs: https://docs.openwebui.com/
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ngo_open_webui
    ports:
      - "3000:8080"
    environment:
      # Security - Generate with: openssl rand -base64 32
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-change-me-to-secure-key}
      
      # Ollama Integration (your local models)
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama}
      
      # OpenAI Integration (for comparison/hybrid queries)
      # Semicolon-separated: real OpenAI + our RAG backend (server-side, Docker network)
      OPENAI_API_BASE_URLS: "https://api.openai.com/v1;http://backend:8000/v1"
      OPENAI_API_KEYS: "${OPENAI_API_KEY:-};sk-dummy"
      
      # RAG Configuration - INTEGRATED WITH YOUR BACKEND
      # Using PostgreSQL + pgvector as shared RAG backend
      ENABLE_RAG: "true"
      VECTOR_DB: pgvector
      PGVECTOR_DB_URL: postgresql://ngo_user:secure_password@postgres:5432/ngo_db
      RAG_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      
      # Web Search (optional - leave false, requires API key)
      ENABLE_WEB_SEARCH: "false"
      
      # User Configuration
      # NOTE: Set to "true" on first setup to create admin account
      # Can be changed to "false" after admin account is created
      ENABLE_SIGNUP: "true"
      DEFAULT_USER_ROLE: admin
    
    volumes:
      - open-webui-data:/app/backend/data
    
    depends_on:
      - postgres
      - ollama
    
    restart: unless-stopped
    
    networks:
      - ngo_network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  ollama_data:
  open-webui-data:

networks:
  ngo_network:
    driver: bridge

